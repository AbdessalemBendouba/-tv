name: Continuous APK Build Pipeline

on:
  # Triggers immediately whenever any file is committed/pushed (including Web UI edits)
  push:
    branches:
      - main
      - master
  
  # Triggers on a regular schedule (e.g., daily at 02:00 UTC)
  schedule:
    - cron: '0 2 * * *'

  # Allows manual triggering from the GitHub Actions dashboard at any time
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble armeabi-v7a APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap Gradle Wrapper (if missing)
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "::warning::gradlew missing. Generating via gradle wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Compile Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Collect and Package Artifacts
        run: |
          mkdir -p output_apks
          find app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} output_apks/ \;
          ls -la output_apks/

      - name: Upload APKs to Artifact Store
        uses: actions/upload-artifact@v4
        with:
          name: tv-armeabi-v7a-apks
          path: output_apks/
          retention-days: 7
